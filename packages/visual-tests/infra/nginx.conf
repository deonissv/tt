log_format visual '$remote_addr [$time_local] "$request" $status $body_bytes_sent';

upstream visual_backend {
    server 127.0.0.1:3000;
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    access_log /var/log/nginx/access.log visual;
    client_max_body_size 100m;
    root /app/public;

    location /api/v1/ws {
        proxy_pass http://visual_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://visual_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /proxy/ {
        proxy_pass http://visual_backend/api/v1/;
        proxy_set_header Host $host;
    }

    # An OBJ comment keeps the failed-model response out of the HTML parser path.
    location = /assets/missing.obj {
        default_type text/plain;
        return 404 "# Visual fixture: intentionally unavailable mesh\n";
    }

    location /assets/ {
        alias /app/assets/;
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }

    location / {
        try_files $uri /index.html;
    }
}
