name: ${COMPOSE_PROJECT_NAME:-tt-visual}

services:
  database:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: visual
      POSTGRES_PASSWORD: visual
      POSTGRES_USER: visual
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U visual -d visual']
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - database-data:/var/lib/postgresql/data

  web:
    image: ${COMPOSE_PROJECT_NAME:-tt-visual}-web
    build:
      context: ../../..
      dockerfile: packages/visual-tests/infra/Dockerfile.app
      args:
        VITE_API_HOST: ${VISUAL_APP_ORIGIN:-http://web:8080}
        VITE_STATIC_HOST: ${VISUAL_APP_ORIGIN:-http://web:8080}
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://visual:visual@database:5432/visual
      JWT_EXPIRES_IN: 24h
      JWT_SECRET: visual-test-only-secret
      PORT: '3000'
      SALT_ROUNDS: '1'
      VITE_API_HOST: ${VISUAL_APP_ORIGIN:-http://web:8080}
      VITE_STATIC_HOST: ${VISUAL_APP_ORIGIN:-http://web:8080}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/api/v1/games').then(r => process.exit(r.status === 401 ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s
    ports:
      - '127.0.0.1:${VISUAL_WEB_PORT:-0}:8080'

  runner:
    image: ${COMPOSE_PROJECT_NAME:-tt-visual}-runner
    build:
      context: ../../..
      dockerfile: packages/visual-tests/infra/Dockerfile.runner
    init: true
    shm_size: 1gb
    ports:
      - '127.0.0.1:0:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  database-data:
