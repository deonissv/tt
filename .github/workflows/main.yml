name: CI

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

env:
  VISUAL_MODE: canonical
  COMPOSE_PROJECT_NAME: tt-visual-${{ github.run_id }}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm run db:gen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Run mutation smoke
        run: npm run test:mutation:smoke
      - name: Upload mutation smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-smoke-${{ github.run_id }}
          path: reports/mutation/smoke/
          retention-days: 7

  build:
    name: Build application
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # Build and export both images for visual tests on every CI event.
      - name: Build application and browser image with layer cache
        uses: docker/bake-action@v7
        with:
          source: .
          files: packages/visual-tests/infra/docker-compose.yml
          targets: |
            web
            runner
          load: true
          set: |
            *.context=.
            web.cache-from=type=gha,scope=visual-web
            web.cache-to=type=gha,scope=visual-web,mode=max
            runner.cache-from=type=gha,scope=visual-runner
            runner.cache-to=type=gha,scope=visual-runner,mode=max
      - name: Export visual test images
        shell: bash
        run: |
          docker save "${COMPOSE_PROJECT_NAME}-web" "${COMPOSE_PROJECT_NAME}-runner" | gzip -1 > "${RUNNER_TEMP}/visual-stack.tar.gz"
      - name: Upload visual test images
        uses: actions/upload-artifact@v4
        with:
          name: visual-images-${{ github.run_id }}
          path: ${{ runner.temp }}/visual-stack.tar.gz
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 1

  visual-regression:
    name: Visual regression (${{ matrix.shard }}/5)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.9.0'
          cache: npm
      - run: npm ci
      - name: Download visual test images
        uses: actions/download-artifact@v4
        with:
          name: visual-images-${{ github.run_id }}
          path: ${{ runner.temp }}/visual-images
      - name: Load visual test images
        run: docker load --input "${RUNNER_TEMP}/visual-images/visual-stack.tar.gz"
      - name: Run visual regression shard
        run: npm run test:visual -- --shard=${{ matrix.shard }}/5
        env:
          VISUAL_SKIP_BUILD: '1'
      - name: Upload visual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-${{ github.run_id }}-shard-${{ matrix.shard }}
          overwrite: true
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm run db:gen
      - run: npm run test:e2e -ws --if-present -- --no-file-parallelism --testTimeout=3000000 --hookTimeout=6000000 --teardownTimeout=6000000
